version: "3.8"

services:
  # 1. High-Performance Redis Caching Service
  redis:
    image: redis:7-alpine
    container_name: agrisense-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. FastAPI Machine Learning & Ingestion Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agrisense-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:///./data/agrisense_production.db
      - ENVIRONMENT=production
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend/data:/app/data

  # 3. Next.js Production Web Application
  frontend:
    build:
      context: ./agrisense
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: agrisense-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000}
      - NODE_ENV=production
    depends_on:
      - backend

volumes:
  redis_data:
